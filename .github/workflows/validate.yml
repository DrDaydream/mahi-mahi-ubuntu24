name: Ubuntu 24.04 deployment tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Check deployment shell syntax
        run: |
          for script in aws/scripts/*.sh local/build.sh; do
            bash -n "$script"
          done
      - name: Test deployment and local runner
        run: python -m pytest -q
